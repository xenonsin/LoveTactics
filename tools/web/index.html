<!doctype html>
<!--
  The shipping page for the love.js bundle. tools/web-build.ps1 copies this over the demo page
  love.js generates, substituting __TITLE__ and __MEMORY__.

  Three things it does that the generated page does not:

    * LETTERBOXES -- and on a TOUCHSCREEN, hands the whole viewport over instead. The game is
      authored in a fixed 1280x720 logical space (scale.lua) and CSS scales the canvas to a 16:9
      box, exactly as it always has on a pointing device. A coarse pointer is the one exception:
      there the box takes the whole screen, the game draws its own bars, and the drawing buffer
      -- which SDL sizes from this element's CSS box whenever a resize event reaches it, times the
      device pixel ratio because conf.lua asks for a high-DPI drawable -- goes portrait with the
      handset, which is what scale.lua's quarter turn needs to see. Emscripten
      maps pointer events through getBoundingClientRect, so a CSS-scaled canvas still reports
      correct mouse coordinates -- but a canvas with border or padding does not, which is why
      the rule below zeroes both and why nothing else may sit inside #stage.

    * REPORTS THE DOWNLOAD. game.data is ~27 MB. Emscripten announces its progress only through
      Module.setStatus text, so the hook below parses the byte counts back out of it and drives
      a real bar. Without this a cold load is half a minute of black.

    * GATES ON A CLICK. Browsers will not start an audio context without a user gesture, so the
      overlay stays up until Play is pressed and that click resumes the context.

      The gate holds the OVERLAY, never the engine. Love(Module) has to be called the moment
      love.js loads: game.js does not fetch anything itself, it pushes its loader onto
      Module.preRun, and preRun is drained by the runtime during startup. No Love(Module), no
      startup, no preRun, no request -- a page that sits on "Downloading..." forever having
      downloaded nothing at all.
-->
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
    <!-- Added to the Home Screen, an iPhone launches this chromeless and full-bleed. That is the
         ONLY full screen iOS has to offer a canvas: Safari implements the Fullscreen API for
         <video> and nothing else, so the Fullscreen button below hides itself there rather than
         standing about doing nothing. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="__TITLE__">
    <meta name="theme-color" content="#0e0f10">
    <title>__TITLE__</title>
    <!-- Inline so the browser stops asking for /favicon.ico and logging a 404 against a host
         that has no such file. A board tile in the theme's gold on its mount -- a placeholder
         standing in until the game has an icon of its own. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0f10'/%3E%3Cpath d='M16 4.5 L27.5 16 L16 27.5 L4.5 16 Z' fill='none' stroke='%23d4ba72' stroke-width='2.5'/%3E%3C/svg%3E">
    <style>
      /* The palette is ui/theme.lua's -- register 5, "Etched Atmosphere" -- so the page the game
         loads on is the same printed stock as the game itself. */
      :root {
        --mount: #0e0f10;
        --panel: #1d1e21;
        --frame: #6b6047;
        --ink:   #ece4d4;
        --muted: #a89a7e;
        --gold:  #d4ba72;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: var(--mount); color: var(--ink);
        font: 14px/1.5 Georgia, "Times New Roman", serif;
        /* A phone treats a canvas like any other page: a drag scrolls, a second tap zooms, a long
           press selects and offers a callout. All three belong to the game instead. */
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      #stage {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      /* No border, no padding: see the header. On a pointing device the box stays the 16:9 it has
         always been, so a desktop browser looks exactly as it did. */
      #canvas {
        display: block; border: 0 none; padding: 0; outline: none;
        background: #000;
        width:  min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        touch-action: none;
        visibility: hidden;
      }
      /* A finger -- so a handset or a tablet, the one screen whose shape is not up for negotiation.
         There the box takes the whole viewport and the GAME draws the letterbox bars, which is what
         hands the engine a portrait drawable to turn (scale.lua). */
      .touch-only { display: none; }
      @media (pointer: coarse) {
        #canvas { width: 100%; height: 100%; }
        .touch-only { display: inline; }
        #note { display: block; }
      }
      #gate {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: var(--mount); text-align: center; padding: 24px;
      }
      #gate.gone { display: none; }
      h1 {
        margin: 0; font-size: clamp(28px, 5vw, 52px); font-weight: normal;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);
      }
      #bar {
        width: min(440px, 80vw); height: 10px;
        background: #090a0b; border: 1px solid var(--frame);
      }
      #fill { height: 100%; width: 0; background: var(--gold); transition: width .15s linear; }
      #status { color: var(--muted); font-size: 13px; letter-spacing: .06em; min-height: 1.5em; }
      #start {
        display: none;
        padding: 12px 40px; font: inherit; font-size: 17px; letter-spacing: .16em;
        text-transform: uppercase; cursor: pointer;
        color: var(--ink); background: var(--panel); border: 1px solid var(--frame);
      }
      #start:hover { color: var(--gold); border-color: var(--gold); }
      /* Nothing left to say on a desktop, and an empty flex item would still eat a 22px gap. */
      #note { display: none; color: var(--muted); font-size: 12px; max-width: 46ch; }
      #full {
        position: fixed; right: 10px; bottom: 8px; z-index: 5; display: none;
        padding: 5px 12px; font: inherit; font-size: 12px; letter-spacing: .1em;
        color: var(--muted); background: transparent; border: 1px solid var(--frame); cursor: pointer;
      }
      #full:hover { color: var(--gold); border-color: var(--gold); }

    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="gate">
      <h1>__TITLE__</h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Downloading&hellip;</div>
      <button id="start">Play</button>
      <div id="note"><span class="touch-only">Held upright, the picture is turned a quarter turn &mdash; tilt the handset to the left to read it.</span></div>
    </div>


    <button id="full" onclick="goFullScreen()">Fullscreen</button>

    <script>
      var gate    = document.getElementById('gate');
      var fill    = document.getElementById('fill');
      var statusEl= document.getElementById('status');
      var start   = document.getElementById('start');
      var full    = document.getElementById('full');

      // Readiness is harder to ask for than it looks, and two obvious answers are both wrong:
      //
      //   * a zero run-dependency count reaches zero once for the engine's own startup, before
      //     game.js has queued the package at all;
      //   * calledRun is set on the way INTO the startup routine, not out of it, so it is true
      //     while the 27 MB package is still arriving.
      //
      // Either alone offers Play a second in and drops the player on a black canvas. This build
      // does not export Module.FS, so the unpacked file cannot be looked for directly. What it
      // does expose is preloadResults, which game.js fills in only AFTER registering the package
      // as a run dependency -- so its presence together with a zero count means that particular
      // dependency has been through its whole life. True on the cached path as well.
      var ready = false;
      function markReady() {
        if (ready) return;
        ready = true;
        statusEl.textContent = 'Ready.';
        fill.style.width = '100%';
        start.style.display = 'inline-block';
      }

      // Fullscreen the DOCUMENT, not the canvas. Emscripten rewrites a canvas's own dimensions when
      // it is the fullscreen element; taking the whole document leaves the canvas an ordinary
      // element filling an ordinary (now screen-sized) viewport, which the resize below handles
      // like any other.
      //
      // iOS Safari has no Fullscreen API outside <video> -- requestFullscreen is simply not there,
      // which is why the button used to do nothing on an iPhone. It is offered only where it works;
      // elsewhere the way to a chromeless game is Share -> Add to Home Screen (see the metas above).
      var fsTarget = document.documentElement;
      var fsRequest = fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen
                   || fsTarget.mozRequestFullScreen || fsTarget.msRequestFullscreen;

      function goFullScreen() {
        if (!fsRequest) return;
        var inFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (inFs) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        } else {
          fsRequest.call(fsTarget);
          // Android and desktop Chrome will hold a landscape lock once the page is fullscreen; iOS
          // has no orientation lock at all, and needs none -- scale.lua turns the picture instead.
          if (screen.orientation && screen.orientation.lock) {
            var p = screen.orientation.lock('landscape');
            if (p && p.catch) p.catch(function () {});
          }
        }
      }

      // SDL sizes the drawing buffer from the canvas's CSS box, but only when a resize event
      // reaches it. Several things move that box without one: the gate coming down, an iPhone's
      // URL bar sliding away, a rotation reported before the new size has settled. Re-announcing
      // it costs nothing (the engine ignores a size it already has) and is what keeps the buffer,
      // the element and the game's own letterbox agreeing on one shape.
      function announceSize() {
        window.dispatchEvent(new Event('resize'));
      }
      window.addEventListener('orientationchange', function () {
        announceSize();
        setTimeout(announceSize, 120);
        setTimeout(announceSize, 400);
      }, false);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', announceSize, false);
      }

      // The game owns these keys; the page must not scroll or space-activate anything underneath.
      window.addEventListener('keydown', function (e) {
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1 && gate.classList.contains('gone')) {
          e.preventDefault();
        }
      }, false);

      // A coarse pointer is a finger: the extra argument is how main.lua knows it is running on a
      // handset, and it is the ONLY thing that lets scale.lua turn the picture a quarter turn. A
      // mouse never sends it, so a desktop browser plays precisely the game the desktop build does.
      var IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

      var Module = {
        arguments: IS_TOUCH ? ['./game.love', 'mobile'] : ['./game.love'],
        INITIAL_MEMORY: __MEMORY__,
        printErr: console.error.bind(console),
        canvas: (function () {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener('webglcontextlost', function (e) {
            e.preventDefault();
            statusEl.textContent = 'The graphics context was lost. Reload the page.';
            gate.classList.remove('gone');
          }, false);
          return canvas;
        })(),
        // Emscripten's only progress channel is this string. "Downloading data... (n/total)" is
        // the package fetch; anything else is a phase name worth showing verbatim.
        totalDependencies: 0,
        remainingDependencies: 0,
        // Emscripten's only progress channel is this string. "Downloading data... (n/total)" is
        // the package fetch; the empty string means it has nothing left to say.
        setStatus: function (text) {
          // Once Play is offered the line reads "Ready."; late progress chatter must not
          // overwrite it with a number that has stopped being true.
          if (!text || ready) return;
          var m = /\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/.exec(text);
          if (m && text.indexOf('Downloading') === 0) {
            var loaded = parseFloat(m[1]), total = parseFloat(m[2]);
            fill.style.width = (100 * loaded / total) + '%';
            statusEl.textContent = 'Downloading ' + (loaded / 1048576).toFixed(1)
                                 + ' / ' + (total / 1048576).toFixed(1) + ' MB';
          } else {
            statusEl.textContent = text;
          }
        },
        // Kept for the counts love.js expects to be able to set; readiness is decided by the
        // poll below, not here.
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
        }
      };

      var waited = 0;
      var readyPoll = setInterval(function () {
        waited += 300;
        if (ready) { clearInterval(readyPoll); return; }
        try {
          var M = window.Module;
          if (M && M.calledRun && M.remainingDependencies === 0
              && M.preloadResults && Object.keys(M.preloadResults).length > 0) {
            markReady();
            clearInterval(readyPoll);
            return;
          }
        } catch (e) { /* runtime not far enough along to ask */ }

        // Never strand the player behind a button that will not appear. If the signals above
        // have not agreed inside two minutes something is wrong, and a Play they can press and
        // report on beats a progress bar that never fills.
        if (waited >= 120000) {
          markReady();
          statusEl.textContent = 'Taking longer than expected -- try Play, and reload if it stays dark.';
          clearInterval(readyPoll);
        }
      }, 300);

      window.onerror = function () {
        statusEl.textContent = 'Something went wrong -- see the browser console.';
        gate.classList.remove('gone');
      };

      // Start the engine the moment love.js has parsed -- see the header for why this cannot
      // wait for the click. The canvas stays hidden behind the overlay meanwhile.
      function applicationLoad() { Love(Module); }

      // The click is what buys us an audio context. Emscripten installs its own resume handlers
      // on user gestures, but which object holds the context differs between SDL builds, so
      // resume anything reachable rather than trusting one path to exist.
      function resumeAudio() {
        var contexts = [];
        try { if (Module.SDL2 && Module.SDL2.audioContext) contexts.push(Module.SDL2.audioContext); } catch (e) {}
        try { if (window.SDL2 && window.SDL2.audioContext) contexts.push(window.SDL2.audioContext); } catch (e) {}
        try { if (Module.audioContext) contexts.push(Module.audioContext); } catch (e) {}
        contexts.forEach(function (ctx) {
          if (ctx && ctx.state === 'suspended' && ctx.resume) ctx.resume();
        });
      }


      start.addEventListener('click', function () {
        gate.classList.add('gone');
        document.getElementById('canvas').style.visibility = 'visible';
        // A button that cannot do its one job is worse than no button: see goFullScreen.
        if (fsRequest) full.style.display = 'block';
        resumeAudio();
        document.getElementById('canvas').focus();
        // The canvas has just become visible and the phone's URL bar is about to move: tell the
        // engine what shape it is now playing on, and again once the browser has settled.
        announceSize();
        setTimeout(announceSize, 250);
        setTimeout(announceSize, 1000);
      });
    </script>
    <!-- ?v= is a content hash stamped in by tools/web-build.ps1 (Set-CacheStamp), so a republished
         bundle is actually fetched instead of served from a ten-minute-old cache. -->
    <script src="game.js?v=__GAME_JS__"></script>
    <script async src="love.js?v=__LOVE_JS__" onload="applicationLoad()"></script>
  </body>
</html>
